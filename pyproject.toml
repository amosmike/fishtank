[project]
name = "fishtank"
version = "0.1.0"
description = "Idea Lab pipeline: agents that find, critique, check and rank website ideas"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
]

[project.optional-dependencies]
# The LangGraph engine (checkpointed, resumable). Without it, `--engine plain` runs the same nodes
# in order and resumes from the run file.
graph = ["langgraph>=0.4", "langgraph-checkpoint-sqlite>=2"]
# Local embeddings and reranking (ONNX runtime, no PyTorch) and the Qdrant vector store. Without
# fastembed, search uses BM25 only; without qdrant-client, vectors are searched exactly in NumPy.
rag = ["fastembed>=0.4", "numpy>=1.26", "qdrant-client>=1.12"]
all = ["fishtank[graph,rag]"]

[tool.setuptools]
packages = ["idea_lab", "idea_lab.steps", "idea_lab.checks", "idea_lab.retrieval"]

[tool.setuptools.package-data]
idea_lab = ["prompts/*.md", "web/*"]
